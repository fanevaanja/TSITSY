services:
  - type: web
    name: tsihoharana
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: OPEN_SOURCE_AI_API_KEY
        sync: false
      - key: OPEN_SOURCE_AI_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPEN_SOURCE_AI_MODEL
        value: openrouter/free
